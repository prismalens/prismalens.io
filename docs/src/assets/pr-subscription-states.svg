<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 476" role="img" aria-labelledby="prs-title prs-desc" style="width:100%;height:auto">
  <title id="prs-title">A pull request subscription's states</title>
  <desc id="prs-desc">A subscription starts active. A host error makes it disconnected until a read works. The setting being off, a rate limit, the daily limit, the agent's usage limit or settling pause it while events wait. After 3 resends without a receipt it shows delivery failing until Retry or your next message. It ends on merge, close, the loop guard, the comment cap or a once subscription's first delivery, delivering what waited; or on your cancel, the agent's cancel, Stop, settle or 7 idle days, withdrawing what waited. Resume in the panel starts a fresh copy.</desc>
  <style>
    .prs-box { fill: var(--sl-color-bg-nav, #f6f6f6); stroke: var(--sl-color-gray-4, #888); stroke-width: 1.25; }
    .prs-on { stroke: var(--sl-color-accent, #4a6cf7); stroke-width: 2; }
    .prs-h { fill: var(--sl-color-white, #111); font: 600 14px system-ui, sans-serif; }
    .prs-s { fill: var(--sl-color-gray-2, #444); font: 12px system-ui, sans-serif; }
    .prs-l { fill: var(--sl-color-gray-2, #444); font: italic 12px system-ui, sans-serif; }
    .prs-a { fill: none; stroke: var(--sl-color-gray-3, #777); stroke-width: 1.5; }
    .prs-m { fill: var(--sl-color-gray-3, #777); }
    .prs-rule { stroke: var(--sl-color-gray-5, #ccc); stroke-width: 1; }
  </style>
  <defs>
    <marker id="prs-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="prs-m" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <!-- Started -->
  <rect class="prs-box" x="30" y="170" width="140" height="60" rx="8"/>
  <text class="prs-h" x="100" y="195" text-anchor="middle">Started</text>
  <text class="prs-s" x="100" y="214" text-anchor="middle">agent, you or auto</text>

  <!-- Active -->
  <rect class="prs-box prs-on" x="225" y="170" width="180" height="60" rx="8"/>
  <text class="prs-h" x="315" y="195" text-anchor="middle">Active</text>
  <text class="prs-s" x="315" y="214" text-anchor="middle">events go out</text>
  <path class="prs-a" d="M170 200 H221" marker-end="url(#prs-arrow)"/>

  <!-- Delivery failing -->
  <rect class="prs-box" x="225" y="30" width="180" height="60" rx="8"/>
  <text class="prs-h" x="315" y="55" text-anchor="middle">Delivery failing</text>
  <text class="prs-s" x="315" y="74" text-anchor="middle">events held, none lost</text>
  <path class="prs-a" d="M285 170 V94" marker-end="url(#prs-arrow)"/>
  <text class="prs-l" x="278" y="128" text-anchor="end">3 resends,</text>
  <text class="prs-l" x="278" y="144" text-anchor="end">no receipt</text>
  <path class="prs-a" d="M345 90 V166" marker-end="url(#prs-arrow)"/>
  <text class="prs-l" x="352" y="128">Retry, or your</text>
  <text class="prs-l" x="352" y="144">next message</text>

  <!-- Disconnected -->
  <rect class="prs-box" x="30" y="300" width="150" height="60" rx="8"/>
  <text class="prs-h" x="105" y="325" text-anchor="middle">Disconnected</text>
  <text class="prs-s" x="105" y="344" text-anchor="middle">events wait</text>
  <path class="prs-a" d="M245 234 L150 296" marker-start="url(#prs-arrow)" marker-end="url(#prs-arrow)"/>
  <text class="prs-l" x="210" y="282">host error /</text>
  <text class="prs-l" x="210" y="298">read works</text>

  <!-- Paused -->
  <rect class="prs-box" x="225" y="320" width="180" height="96" rx="8"/>
  <text class="prs-h" x="315" y="344" text-anchor="middle">Paused</text>
  <text class="prs-s" x="315" y="364" text-anchor="middle">setting off, rate limit,</text>
  <text class="prs-s" x="315" y="380" text-anchor="middle">daily limit, usage limit,</text>
  <text class="prs-s" x="315" y="396" text-anchor="middle">settling. Events wait.</text>
  <path class="prs-a" d="M345 234 V316" marker-start="url(#prs-arrow)" marker-end="url(#prs-arrow)"/>

  <!-- Ended -->
  <rect class="prs-box" x="470" y="20" width="270" height="400" rx="8"/>
  <text class="prs-h" x="490" y="48">Ended</text>
  <text class="prs-s" x="490" y="76" font-weight="600">Waiting events delivered first</text>
  <text class="prs-s" x="502" y="98">merged</text>
  <text class="prs-s" x="502" y="118">closed</text>
  <text class="prs-s" x="502" y="138">a check kept failing on 3 pushes</text>
  <text class="prs-s" x="502" y="158">5 bot or agent rounds in a row</text>
  <text class="prs-s" x="502" y="178">delivered once</text>
  <line class="prs-rule" x1="486" y1="198" x2="724" y2="198"/>
  <text class="prs-s" x="490" y="224" font-weight="600">Waiting events withdrawn</text>
  <text class="prs-s" x="502" y="246">cancelled by you</text>
  <text class="prs-s" x="502" y="266">cancelled by the agent</text>
  <text class="prs-s" x="502" y="286">thread stopped</text>
  <text class="prs-s" x="502" y="306">thread settled</text>
  <text class="prs-s" x="502" y="326">expired: 7 days idle</text>
  <text class="prs-s" x="490" y="362">A message already sent stays sent</text>
  <text class="prs-s" x="490" y="380">and is counted "already sent".</text>
  <path class="prs-a" d="M405 190 L466 120" marker-end="url(#prs-arrow)"/>
  <path class="prs-a" d="M405 212 L466 270" marker-end="url(#prs-arrow)"/>

  <!-- Resume -->
  <path class="prs-a" d="M605 420 V456 H12 V200 H26" marker-end="url(#prs-arrow)"/>
  <text class="prs-l" x="300" y="449" text-anchor="middle">Resume in the panel: a fresh copy, counting from now</text>
</svg>
