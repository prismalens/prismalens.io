# Content rules from design/GUIDELINES.md, enforced in CI (build-site.yml, build-docs.yml).
StylesPath = .vale/styles
MinAlertLevel = warning

[formats]
mdx = md

[docs/src/content/**/*.{md,mdx}]
BasedOnStyles = PrismaLens
TokenIgnores = (^import .*$), (<[A-Z]\w*[^>]*>), (</[A-Z]\w*>)

# The site is judged on its built HTML, so only text a visitor sees counts.
[site/dist/**/*.html]
BasedOnStyles = PrismaLens, PrismaLensSite
