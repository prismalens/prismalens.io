# Content rules from design/GUIDELINES.md, enforced in CI (build-site.yml, build-docs.yml).
StylesPath = .vale/styles
MinAlertLevel = warning

[formats]
mdx = md

[docs/src/content/**/*.{md,mdx}]
BasedOnStyles = PrismaLens
TokenIgnores = (^import .*$), (<[A-Z]\w*[^>]*>), (</[A-Z]\w*>)

# The site is judged on its built HTML, so only text a visitor sees counts.
[site/dist/**/*.html]
BasedOnStyles = PrismaLens, PrismaLensSite

# Use-case pages answer search intent: they may name the product's real nouns, ask the
# query as a heading and answer it in short paragraphs (design/GUIDELINES.md rules 4 and 6).
# Every other rule holds; scripts/use-cases.test.ts enforces their word limits.
[site/dist/use-cases/**/*.html]
BasedOnStyles = PrismaLens, PrismaLensSite, PrismaLensUseCase
PrismaLensSite.GenericNouns = NO
PrismaLensSite.SentenceLength = NO
PrismaLensSite.HeadingLength = NO
