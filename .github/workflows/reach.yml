# Sends daily npm, GitHub and Homebrew reach counts to PostHog (design/REACH.md).
# GitHub traffic needs the REACH_GITHUB_TOKEN secret; without it that part is skipped.
name: reach

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print the events instead of sending them'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: reach
  cancel-in-progress: false

jobs:
  collect:
    name: Collect reach counts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Collect and send
        env:
          REACH_GITHUB_TOKEN: ${{ secrets.REACH_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: pnpm exec tsx scripts/reach/collect.mts $DRY_RUN
