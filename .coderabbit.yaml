# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Auto review is off: the hourly `CodeRabbit summoner` routine (Sumit1993/rig scripts/coderabbit-routine)
# summons one PR per hour across every repo, because the allowance is per developer (Sumit1993/rig#150).
# Sessions never summon by hand; they reply in each thread and the routine re-reviews.
language: en-US
reviews:
  profile: chill
  auto_review:
    enabled: false
    drafts: false
    auto_pause_after_reviewed_commits: 1
