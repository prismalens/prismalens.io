# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Auto review is off: the hourly `CodeRabbit summoner` routine (Sumit1993/rig scripts/coderabbit-routine)
# summons one PR per hour across every repo, because the allowance is per developer (Sumit1993/rig#150).
# Sessions never summon by hand; they reply in each thread and the routine re-reviews.
language: en-US
reviews:
  profile: chill
  auto_review:
    enabled: false
    drafts: false
    auto_pause_after_reviewed_commits: 1
  path_instructions:
    - path: "docs/src/content/docs/**"
      instructions: >-
        These docs follow `docs/POLICY.md`. Flag a page or passage that documents something on its "Keep out" list
        (settings click-paths beyond the one a task needs, terminal transcripts, limits and tuning constants, flags or
        environment variables no contract task needs, version history, newly added or still-changing features, internals),
        and flag a new page that is not in its contract table. Flag "self-hosted" or server wording: PrismaLens is an app
        that runs on the user's machine.
