# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Auto review is off: the hourly `CodeRabbit summoner` routine (Sumit1993/rig scripts/coderabbit-routine)
# summons one PR per hour across every repo, because the allowance is per developer (Sumit1993/rig#150).
# Sessions never summon by hand; they reply in each thread and the routine re-reviews.
language: en-US
reviews:
  profile: chill
  auto_review:
    enabled: false
    drafts: false
    auto_pause_after_reviewed_commits: 1
  path_instructions:
    - path: "docs/src/content/docs/**"
      instructions: >-
        These docs follow `docs/POLICY.md`. Flag a page or passage that documents something on its "Keep out" list
        (settings click-paths beyond the one a task needs, terminal transcripts, limits and tuning constants, flags or
        environment variables no contract task needs, version history, newly added or still-changing features, internals),
        and flag a new page that is not in its contract table. Flag a specific claim (a default, a label, a limit, a behaviour) the PR gives no source for, and suggest deleting it rather than softening it. Flag any version number (PrismaLens, Node, an agent) and any "since" or "upgrading from" note. Flag "self-hosted" or server wording: PrismaLens is an app
        that runs on the user's machine.
    - path: "site/src/**"
      instructions: >-
        The site follows `design/GUIDELINES.md`. Flag text outside `design/COPY.md` or over its budget (hero headline of 6
        words or fewer and one line of 10 or fewer; other headings of 5 words or fewer, at most one line of 10; no paragraphs,
        captions, disclaimers or explainer tooltips). Flag product-specific nouns (incident, investigation, hypothesis, SRE,
        on-call, setting, flag or permission-level names): the site stays generic. Flag hard-coded colours instead of tokens,
        a rotating tick used as a spinner, an async surface with no skeleton, empty or failed state, animation with no
        prefers-reduced-motion path, a looping demo that doesn't pause when hidden or hovered, controls without a focus ring,
        and a new runtime dependency added for an effect.
    - path: "docs/src/{components,styles}/**"
      instructions: >-
        The docs theme follows `design/GUIDELINES.md` (Look, Motion and states, Accessibility). Flag hard-coded colours
        instead of tokens, animation with no prefers-reduced-motion path, and missing focus rings.
